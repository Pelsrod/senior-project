<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewing</title>
    
</head>

<body>
	<button onclick = "backToHome()">Back To Homepage</button>
	<button onclick = "viewSelectedCharacter()">View Selected Character</button>
	<button onclick = "viewCharacterFile()">View Inserted Character</button><br>
	<select id = "characterDropdown"></select>
	<div class = "input-group">
		<label for="characterToView">Insert Export JSON:</label>
        <input class="characterToView" type="file" id="characterFile" accept = ".json">
	</div>
	<div id = "characterDetails" class = "details"></div>
	<script>
		let characters = [];

		function backToHome(){
			window.location.href = "index.html";
		}

		function loadCharacterList(){
			const dropdown = document.getElementById("characterDropdown");
			dropdown.innerHTML = "";
			const stored = localStorage.getItem('characters');
			if(!stored ){
				alert("No characters to view at this time");
				dropdown.innerHTML = `<option disabled selected>No characters saved at this time</option>`;
				return;
			}
			characters = JSON.parse(stored);
			if(characters.length == 0){
				alert("No characters to view at this time");
				dropdown.innerHTML = `<option disabled selected>No characters saved at this time</option>`;
				return;
			}
			characters.sort((a, b) => a.name.localeCompare(b.name));
			dropdown.innerHTML = `<option disabled selected>Pick a Character</option>`;
			characters.forEach((char, index) => {
				const opt = document.createElement("option");
				opt.value = index;
				opt.textContent = char.name;
				dropdown.appendChild(opt);
			});
			
		}

		function viewCharacterFile(){
			const fileInput = document.getElementById("characterFile");
    		const file = fileInput.files[0];
			let characterReader = new FileReader();
			if(!file){
				alert('Please insert a valid character file.');
				return;
			}
			characterReader.onload = function(e) {
        		try {
            		const character = JSON.parse(e.target.result);

            		let html = `
                		<h2>${character.name}</h2>
                		<p><strong>Total Level:</strong> ${character.totalLevel}</p>
                		<h3>Classes:</h3>
                		<ul>
            		`;
					character.classes.forEach(c => {
                		html += `
                    		<li>
                       			${c.className}:
                        		${c.subClassName} - Level ${c.classLevel}
                    		</li>
                		`;
            		});

            		html += `</ul>`;
					html += `
						<h3>Action:</h3>
                		<ul>
					`;
					character.actions.forEach(c => {
                		html += `
                    		<li>
                       			${c.actionName}:
                        		${c.actionDescription} -  ${c.actionResource}
                    		</li>
                		`;
            		});
					html += `</ul>`;
					html += `
						<h3>Bonus Action:</h3>
                		<ul>
					`;
					character.bonusActions.forEach(c => {
                		html += `
                    		<li>
                       			${c.bonusActionName}:
                        		${c.bonusActionDescription} -  ${c.bonusActionResource}
                    		</li>
                		`;
            		});
					html += `</ul>`;
					html += `
						<h3>Reaction:</h3>
                		<ul>
					`;
					character.reactions.forEach(c => {
                		html += `
                    		<li>
                       			${c.reactionName}:
                        		${c.reactionDescription} -  ${c.reactionResource}
                    		</li>
                		`;
            		});
					html += `</ul>`;
					html += `
						<h3>Other Resources:</h3>
                		<ul>
					`;
					character.otherResources.forEach(c => {
                		html += `
                    		<li>
                       			${c.resourceName}: amount - ${c.resourceAmount}
                    		</li>
                		`;
            		});
					html += `</ul>`;
            		document.getElementById("characterDetails").innerHTML = html;

        			} catch (err) {
            			document.getElementById("characterDetails").textContent = "Could not read JSON character file.";
        			}
    			};

    		characterReader.readAsText(file);
		}

		function viewSelectedCharacter(){
			const dropdown = document.getElementById("characterDropdown");
			const selectedIndex = dropdown.value;
			const detail = document.getElementById("characterDetails");
			if(selectedIndex == "" || selectedIndex == "Pick a Character"){
				alert("Please Select a Valid Character");
				return;
			}
			const selectedCharacter = characters[selectedIndex];
			detail.innerHTML = `
				<h2>${selectedCharacter.name}</h2>
				<p><strong>Total Level:</strong> ${selectedCharacter.totalLevel}</p>
				<h3>Classes:</h3>
				<ul>
					${selectedCharacter.classes
					.map(c => `<li>${c.className}: ${c.subClassName} - Level ${c.classLevel}</li>`)
					.join("")}
				</ul>
				<h3>Actions:</h3>
				<ul>
					${selectedCharacter.actions
					.map(c => `<li>${c.actionName}: ${c.actionDescription} - uses ${c.actionResource}`)
					.join("")}
				</ul>
				<h3>Bonus Actions:</h3>
				<ul>
					${selectedCharacter.bonusActions
					.map(c => `<li>${c.bonusActionName}: ${c.bonusActionDescription} - uses ${c.bonusActionResource}`)
					.join("")}
				</ul>
				<h3>Reactions:</h3>
				<ul>
					${selectedCharacter.reactions
					.map(c => `<li>${c.reactionName}: ${c.reactionDescription} - uses ${c.reactionResources}`)
					.join("")}
				</ul>
				<h3>Resources:</h3>
				<ul>
					${selectedCharacter.otherResources
					.map(c => `<li>${c.resourceName}: amount -  ${c.resourceAmount}`)
					.join("")}
				</ul>
			`;
		}

		loadCharacterList();
		
	</script>
</body>
</html>
